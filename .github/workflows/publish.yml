name: Publish to npm

# Runs when the maintainer pushes a version tag (e.g. v1.1.0) on a commit of main.
# No secret: npm trusted publishing (OIDC). npm trusts this exact workflow file in this repo, configured once
# by the owner on npmjs.com (see README "Release process"). Nothing is stored, nothing to rotate.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC identity for npm trusted publishing (and provenance)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: npm 11.5.1+ (required for trusted publishing)
        run: npm install -g npm@11.21.1

      - name: Check that the tag matches package.json
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "v${pkg_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg_version}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Type-check, test, build
        run: make check

      - name: Publish with provenance
        run: npm publish --provenance --access public
